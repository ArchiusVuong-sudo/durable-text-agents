[project]
name = "durable-text-agents"
version = "0.1.0"
description = "Prototype SMS channel and durable session layer for LiveKit Agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "Khanh Vuong Tuan" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents==1.8.6",
    "claude-agent-sdk==0.2.165",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_text"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs a Claude login or ANTHROPIC_API_KEY (run with LIVE=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/durable_text"]
